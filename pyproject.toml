[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackspot"
version = "0.1.0"
description = "Accident Blackspot Mapper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "geopy>=2.4.0",
    "folium>=0.15.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "pytest>=7.4.0",
    "streamlit>=1.30.0",
    "streamlit-folium>=0.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]
